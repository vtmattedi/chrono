services:
  node:
    container_name: chrono
    build: ./
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.chrono.rule=Host(`chrono.mattedidev.com.br`)
      - traefik.http.routers.chrono.tls=true
      - traefik.http.routers.chrono.entrypoints=web,websecure
      - traefik.http.routers.chrono.tls.certresolver=mytlschallenge
      - traefik.http.services.chrono.loadbalancer.server.port=4500
      # Forward real IP headers
      - "traefik.http.middlewares.chrono-headers.headers.customrequestheaders.X-Real-IP="
      - "traefik.http.middlewares.chrono-headers.headers.customrequestheaders.X-Forwarded-For="
      - "traefik.http.middlewares.chrono-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.chrono.middlewares=chrono-headers"
    ports:
      - 4500:4500

